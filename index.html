<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1017" />
    <title>3GookG</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/game/style.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-sword" viewBox="0 0 24 24"><path d="M14.5 3.5 20.5 3.5 20.5 9.5 9.5 20.5 3.5 14.5ZM6 12 12 18M4 20 7 17" /></symbol>
        <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 2.5C13 8 16 11 21.5 12 16 13 13 16 12 21.5 11 16 8 13 2.5 12 8 11 11 8 12 2.5Z" /></symbol>
        <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 20 6V12C20 16.5 16.8 19.8 12 21.5 7.2 19.8 4 16.5 4 12V6Z" /></symbol>
        <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 6 4 11 9 16M4 11H14.5A5.5 5.5 0 0 1 14.5 22H10" /></symbol>
        <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 5 13 12 5 19ZM14 5 22 12 14 19Z" /></symbol>
        <symbol id="i-map" viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7H20M4 12H20M4 17H20" /></symbol>
      </defs>
    </svg>
    <div id="app">
      <header id="topbar">
        <span id="turn"></span>
        <span id="objective"></span>
        <button id="btn-map" type="button" aria-label="전체 지도" hidden><svg class="icon" aria-hidden="true"><use href="#i-map" /></svg><span class="label">지도</span></button>
        <button id="btn-menu" type="button" aria-label="메뉴"><svg class="icon" aria-hidden="true"><use href="#i-menu" /></svg><span class="label">메뉴</span></button>
      </header>
      <main id="stage">
        <div id="mapview" hidden>
          <canvas id="mapview-canvas"></canvas>
          <p>누른 곳으로 화면이 옮겨 갑니다. 파랑 아군, 주황 적, 금색 목표</p>
        </div>
      </main>
      <section id="info" aria-live="polite">
        <div id="info-main">
          <canvas id="portrait" width="240" height="240" aria-hidden="true"></canvas>
          <div id="unit-info"></div>
        </div>
        <div id="skill-list" hidden></div>
        <div id="message"></div>
      </section>
      <nav id="actions">
        <button id="btn-attack" type="button"><svg class="icon" aria-hidden="true"><use href="#i-sword" /></svg><span class="label">공격</span><kbd>A</kbd></button>
        <button id="btn-wait" type="button"><svg class="icon" aria-hidden="true"><use href="#i-shield" /></svg><span class="label">대기</span><kbd>W</kbd></button>
        <button id="btn-cancel" type="button"><svg class="icon" aria-hidden="true"><use href="#i-undo" /></svg><span class="label">취소</span><kbd>Esc</kbd></button>
        <button id="btn-end" type="button"><svg class="icon" aria-hidden="true"><use href="#i-next" /></svg><span class="label" id="btn-end-label">턴 종료</span><kbd>E</kbd></button>
        <button id="btn-skill" type="button" hidden><svg class="icon" aria-hidden="true"><use href="#i-spark" /></svg><span class="label">기술</span><kbd>S</kbd></button>
      </nav>
    </div>
    <div id="result" hidden>
      <div id="result-card">
        <div id="result-rule" aria-hidden="true"></div>
        <h1 id="result-title"></h1>
        <p id="result-detail"></p>
        <div id="result-actions">
          <button id="btn-next" type="button" hidden>다음 화<kbd>Enter</kbd></button>
          <button id="btn-restart" type="button">다시 하기</button>
          <button id="btn-result-menu" type="button">화 선택</button>
        </div>
      </div>
    </div>
    <div id="menu" hidden>
      <div id="menu-card">
        <h1>메뉴</h1>
        <div id="menu-current"></div>
        <button id="btn-resume" type="button">계속하기<kbd>Esc</kbd></button>
        <button id="btn-retry" type="button">이 화 다시 시작</button>
        <h2>화 선택</h2>
        <div id="episode-list"></div>
      </div>
    </div>
    <div id="rotate-notice">폰을 세로로 돌려 주세요</div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
